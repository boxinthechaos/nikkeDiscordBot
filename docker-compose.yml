version: '3.8'
services:
  bot:
    build: .
    restart: always
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${db_password}
      - MYSQL_DATABASE=discord
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: